[project]
name = "api"
version = "0.1.0"
description = "Aporia API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "langfuse>=4.7,<5.0",
    "litellm>=1.110.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sentry-sdk>=2.75.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]
rerank = [
    "sentence-transformers>=6.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs a reachable Postgres (skipped otherwise)",
    "sandbox: needs a reachable Judge0 (skipped otherwise)",
]
