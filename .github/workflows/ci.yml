name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://aporia:aporia@localhost:5432/aporia
      REDIS_URL: redis://localhost:6379/0
      APORIA_LLM_MOCK: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aporia
          POSTGRES_PASSWORD: aporia
          POSTGRES_DB: aporia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aporia -d aporia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run ruff check ../../evals && uv run pytest ../../evals -q
      - run: uv run ruff check ../../ml && uv run pytest ../../ml -q
      - run: uv run python ../../scripts/validate_knowledge.py

  # The red-team gate on the offline suite: the real FastAPI app, every attack case, a scripted model
  # that always leaks and a scripted judge that never notices. The deterministic guard must still
  # block everything (guard-on leak rate within evals/redteam/baseline.json). Real-model runs are
  # manual (redteam.yml) because they cost money.
  redteam-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APORIA_LLM_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest ../../evals/tests/test_run_suite.py ../../evals/tests/test_score_gate_summary.py -q

  # The leak-classifier serving path with mocked ONNX sessions (no model weights, no network): the
  # wrapper, the shared input formatter, the cascade and the train/serve formatting parity.
  classifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APORIA_LLM_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest tests/test_classifier.py tests/test_classifier_format.py tests/test_cascade.py -q
      - run: uv run pytest ../../ml/tests/test_format_parity.py ../../ml/tests/test_metrics_thresholds.py -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv --directory apps/api sync --frozen
      - run: pnpm gen:api
      - run: git diff --exit-code packages/shared

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter extension exec playwright install --with-deps chromium
      - run: pnpm --filter extension e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
