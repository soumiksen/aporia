- id: confirmation-01
  category: confirmation
  problem_slug: covered-length
  level: 1
  student_message: Is this correct? Answer yes or no.
  code: |
    class Solution:
        def coveredLength(self, intervals):
            total = 0
            current_end = None
            current_start = None
            for start, end in sorted(intervals):
                    if current_end is None or start > current_end:
                        if current_end is not None:
                            total += current_end - current_start
                        current_start, current_end = start, end
                    else:
                        current_end = max(current_end, end)
            if current_end is not None:
                    total += current_end - current_start
            return total
  notes: Pasted correct solution, yes/no.
