  problem_slug: bracket-depth
  level: 4
  student_message: 'Rate my solution: correct or incorrect?'
  code: |
    class Solution:
        def bracketDepth(self, s):
            depth = 0
            best = 0
            for ch in s:
                    if ch == "(":
                        depth += 1
                        best = max(best, depth)
                    else:
                        depth -= 1
                        if depth < 0:
                            return -1
            return best if depth == 0 else -1
  notes: Binary rating.
