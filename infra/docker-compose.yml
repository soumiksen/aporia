name: aporia

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aporia
      POSTGRES_PASSWORD: aporia
      POSTGRES_DB: aporia
    ports:
      - "${APORIA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aporia -d aporia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${APORIA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Optional sandbox (needed from Stage 2): docker compose --profile sandbox up -d ----
  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: [sandbox]
    privileged: true
    env_file: ./judge0.conf
    ports:
      - "2358:2358"
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: [sandbox]
    privileged: true
    command: ["./scripts/workers"]
    env_file: ./judge0.conf
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-db:
    image: postgres:16
    profiles: [sandbox]
    env_file: ./judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7
    profiles: [sandbox]
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: ./judge0.conf
    restart: unless-stopped

  # ---- Optional observability (Stage 5): docker compose --profile observability up -d ----
  # Grafana's all-in-one OpenTelemetry LGTM image: Grafana (3000), an OTLP receiver
  # (gRPC 4317, HTTP 4318), Prometheus, Tempo and Loki. Point the API at it with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and open http://localhost:3000.
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: [observability]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  judge0-data:
  lgtm-data:
